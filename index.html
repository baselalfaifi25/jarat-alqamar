<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقهى جارة القمر</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}

body{
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;
  font-family:"Cairo",sans-serif;
  background:linear-gradient(170deg,#fdfaf4 0%,#f9f1e4 50%,#f4e8d5 100%);
}

/* ==============================
   إزالة .phone-wrap و .screen
   عند النشر الحقيقي على الجوال
   ============================== */
.phone-wrap{
  width:375px;height:812px;
  border-radius:48px;
  overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,0.35),0 0 0 1px rgba(200,160,80,0.2);
}

.screen{
  width:100%;height:100%;
  background:linear-gradient(170deg,#fdfaf4 0%,#f9f1e4 50%,#f4e8d5 100%);
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
}
.screen::-webkit-scrollbar{display:none;}

/* خلفية ناعمة */
.bg-circle{position:absolute;border-radius:50%;pointer-events:none;z-index:0;}
.bc1{width:300px;height:300px;top:-60px;right:-60px;background:radial-gradient(circle,rgba(212,175,100,0.08),transparent 70%);}
.bc2{width:250px;height:250px;bottom:60px;left:-50px;background:radial-gradient(circle,rgba(180,130,70,0.06),transparent 70%);}

/* الهيرو */
.hero{
  display:flex;flex-direction:column;align-items:center;
  padding:52px 22px 28px;
  position:sticky;top:0;z-index:5;
  background:linear-gradient(170deg,rgba(253,250,244,0.97) 0%,rgba(249,241,228,0.97) 100%);
  backdrop-filter:blur(10px);
  transition:padding 0.35s ease;
}

/* الشعار */
.logo-wrap{
  position:relative;
  width:90px;height:90px;
  margin-bottom:14px;
  transition:width 0.35s ease,height 0.35s ease,margin-bottom 0.35s ease;
  flex-shrink:0;
}
.logo-wrap.small{width:54px;height:54px;margin-bottom:8px;}

.logo-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(200,160,80,0.22);
}

.logo-circle{
  position:absolute;inset:10px;border-radius:50%;
  background:linear-gradient(145deg,#fffcf5,#fff5e0);
  border:1px solid rgba(200,160,80,0.3);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(160,110,30,0.1),inset 0 1px 0 rgba(255,255,255,0.9);
  font-size:26px;color:rgba(155,105,35,0.85);
  overflow:hidden;
  transition:inset 0.35s ease,font-size 0.35s ease;
}
.logo-wrap.small .logo-circle{inset:6px;font-size:16px;}

.logo-circle img{
  width:38px;height:38px;object-fit:contain;
  transition:width 0.35s,height 0.35s;
}
.logo-wrap.small .logo-circle img{width:22px;height:22px;}

.name-ar{
  font-size:22px;font-weight:800;color:#3a2008;
  margin-bottom:2px;
  transition:font-size 0.35s ease;
}
.name-ar.small{font-size:16px;}

.name-en{
  font-size:10px;font-weight:600;
  color:rgba(155,105,40,0.6);
  letter-spacing:3.5px;text-transform:uppercase;
  transition:opacity 0.25s ease,font-size 0.25s ease,margin 0.25s ease;
}
.name-en.hidden{opacity:0;font-size:0;margin:0;}

.hero-line{
  width:100%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,160,80,0.2),transparent);
  margin-top:18px;
  transition:opacity 0.3s;
}
.hero-line.hidden{opacity:0;margin-top:0;}

/* المحتوى */
.content{
  position:relative;z-index:2;
  padding:22px 20px 36px;
  display:flex;flex-direction:column;
  gap:10px;
}

/* فاصل الماسة */
.sep{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.sep-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(200,160,80,0.28));}
.sep-line.r{background:linear-gradient(90deg,rgba(200,160,80,0.28),transparent);}
.sep-diamond{
  width:6px;height:6px;
  background:rgba(200,160,80,0.45);
  transform:rotate(45deg);border-radius:1px;flex-shrink:0;
}

/* الأزرار */
.btn{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;border-radius:15px;
  text-decoration:none;font-family:"Cairo",sans-serif;font-weight:700;
  border:1px solid transparent;
  transition:transform 0.2s ease,box-shadow 0.2s ease,background 0.2s;
  position:relative;overflow:hidden;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.25),transparent 60%);
  pointer-events:none;
}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:scale(0.98);}

.btn-main{
  background:linear-gradient(135deg,#6b3a1f,#8c5230);
  color:#fdf0dd;
  box-shadow:0 4px 18px rgba(107,58,31,0.25);
}
.btn-main:hover{box-shadow:0 8px 24px rgba(107,58,31,0.35);}

.btn-out{
  background:rgba(255,255,255,0.65);
  border-color:rgba(200,160,80,0.35);
  color:#6b3a1f;
  box-shadow:0 2px 12px rgba(200,160,80,0.08);
}
.btn-out:hover{background:rgba(255,255,255,0.9);}

.btn-ghost{
  background:rgba(255,255,255,0.35);
  border-color:rgba(180,140,70,0.15);
  color:rgba(90,55,15,0.65);
}
.btn-ghost:hover{background:rgba(255,255,255,0.55);}

.btn-txt{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.btn-ar{font-size:14px;font-weight:700;}
.btn-en{font-size:10px;opacity:0.55;font-weight:400;letter-spacing:0.3px;}

.btn-ico{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;
}
.btn-main .btn-ico{background:rgba(255,255,255,0.12);color:rgba(255,235,190,0.9);}
.btn-out .btn-ico{background:rgba(200,160,80,0.12);color:#9a6520;}
.btn-ghost .btn-ico{background:rgba(160,110,40,0.08);color:rgba(120,75,20,0.6);}

/* السوشال */
.soc-title{
  font-size:10px;font-weight:700;
  color:rgba(120,80,30,0.35);
  letter-spacing:2px;text-transform:uppercase;
  text-align:center;margin-top:4px;
}
.soc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}

.soc{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:13px 6px;border-radius:14px;text-decoration:none;
  background:rgba(255,255,255,0.55);
  border:1px solid rgba(200,160,80,0.12);
  box-shadow:0 2px 8px rgba(0,0,0,0.03),inset 0 1px 0 rgba(255,255,255,0.9);
  transition:transform 0.2s ease,box-shadow 0.2s ease,background 0.2s;
}
.soc:hover{transform:translateY(-3px);}
.soc i{font-size:20px;}
.soc span{font-size:9px;font-weight:700;font-family:"Cairo",sans-serif;color:rgba(100,65,20,0.4);}

.soc.wa:hover{background:rgba(235,255,242,0.9);border-color:rgba(37,211,102,0.3);box-shadow:0 6px 16px rgba(37,211,102,0.1);}
.soc.wa i{color:#1a9e50;}
.soc.sc:hover{background:rgba(255,255,220,0.9);border-color:rgba(200,180,0,0.3);box-shadow:0 6px 16px rgba(200,180,0,0.08);}
.soc.sc i{color:#b8a000;}
.soc.ig:hover{background:rgba(255,235,242,0.9);border-color:rgba(200,50,100,0.25);box-shadow:0 6px 16px rgba(200,50,100,0.08);}
.soc.ig i{color:#c0335a;}

/* ظهور تدريجي */
.fade-in{animation:fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.d1{animation-delay:0.05s}.d2{animation-delay:0.12s}.d3{animation-delay:0.19s}
.d4{animation-delay:0.26s}.d5{animation-delay:0.33s}.d6{animation-delay:0.4s}
</style>
</head>
<body>

<!-- 
  للنشر على الجوال: احذف div.phone-wrap و div.screen
  واستبدلهم بـ div واحد بـ class="content" مباشرة
-->
<div class="phone-wrap">
<div class="screen" id="screen">

  <div class="bg-circle bc1"></div>
  <div class="bg-circle bc2"></div>

  <div class="hero" id="hero">
    <div class="logo-wrap" id="logoWrap">
      <div class="logo-ring"></div>
      <div class="logo-circle">
        <img src="logo_clean.png">
        
      </div>
    </div>
    <p class="name-ar" id="nameAr">مقهى جارة القمر</p>
    <p class="name-en" id="nameEn">Jarat Al Qamar</p>
    <div class="hero-line" id="heroLine"></div>
  </div>

  <div class="content">

    <div class="sep fade-in d1">
      <div class="sep-line"></div>
      <div class="sep-diamond"></div>
      <div class="sep-line r"></div>
    </div>

    <a href="menu.html" class="btn btn-main fade-in d2">
      <span class="btn-txt">
        <span class="btn-ar">منيو المشروبات</span>
        <span class="btn-en">Drinks Menu</span>
      </span>
      <span class="btn-ico"><i class="fas fa-mug-hot"></i></span>
    </a>

    <a href="dessert.html" class="btn btn-out fade-in d3">
      <span class="btn-txt">
        <span class="btn-ar">منيو الحلويات</span>
        <span class="btn-en">Dessert Menu</span>
      </span>
      <span class="btn-ico"><i class="fas fa-cookie-bite"></i></span>
    </a>

    <a href="https://maps.app.goo.gl/EdWLHkH9VfmzNYXz9?g_st=ic" target="_blank" class="btn btn-ghost fade-in d4">
      <span class="btn-txt">
        <span class="btn-ar">تجدونا هنا</span>
        <span class="btn-en">Find us on Maps</span>
      </span>
      <span class="btn-ico"><i class="fas fa-location-dot"></i></span>
    </a>

    <p class="soc-title fade-in d5">تواصل معنا</p>
    <div class="soc-grid fade-in d6">
      <a href="https://wa.me/966507462033" target="_blank" class="soc wa">
        <i class="fab fa-whatsapp"></i>
        <span>واتساب</span>
      </a>
      <a href="https://snapchat.com/t/sh2qHyb5" target="_blank" class="soc sc">
        <i class="fab fa-snapchat"></i>
        <span>سناب</span>
      </a>
      <a href="https://www.instagram.com/jaratalqamar.sa" target="_blank" class="soc ig">
        <i class="fab fa-instagram"></i>
        <span>إنستقرام</span>
      </a>
    </div>

  </div>
</div>
</div>

<script>
const screen   = document.getElementById('screen');
const logoWrap = document.getElementById('logoWrap');
const nameAr   = document.getElementById('nameAr');
const nameEn   = document.getElementById('nameEn');
const heroLine = document.getElementById('heroLine');
const hero     = document.getElementById('hero');

screen.addEventListener('scroll', () => {
  const scrolled = screen.scrollTop > 40;
  logoWrap.classList.toggle('small', scrolled);
  nameAr.classList.toggle('small', scrolled);
  nameEn.classList.toggle('hidden', scrolled);
  heroLine.classList.toggle('hidden', scrolled);
  hero.style.paddingTop    = scrolled ? '18px' : '52px';
  hero.style.paddingBottom = scrolled ? '14px' : '28px';
});
</script>

</body>
</html>
